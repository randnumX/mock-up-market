[project]
name = "mock-up-market-backend"
version = "0.1.0"
description = "Mock Up Market Backend Service"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11.3",
    "dotenv>=0.9.9",
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "gunicorn>=26.2.0",
    "ipykernel>=7.3.0",
    "kiteconnect>=5.2.2",
    "notebook>=7.6.2",
    "pandas>=3.0.6",
    "pymongo>=4.18.1",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "mongomock>=4.3.0",
    "pytest>=9.1.1",
]
