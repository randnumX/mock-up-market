services:
  mongo:
    image: mongo:latest
    container_name: mock-up-market-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # `backend` and `frontend` are opt-in via the "full" profile so the default
  # `docker compose up -d` behavior (just Mongo, for local hybrid dev with
  # `python run.py` / `npm run dev` run natively) is unchanged. Run the whole
  # app containerized with:
  #   docker compose --profile full up --build -d
  backend:
    build: ./backend
    container_name: mock-up-market-backend
    profiles: ["full"]
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      MONGO_URI: mongodb://mongo:27017
      DB_NAME: ${DB_NAME:-AlgoTradingSource}
      FLASK_PORT: 5000
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-change-this-in-production}
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:5173
      KITE_ALLOW: ${KITE_ALLOW:-true}
      KITE_API_KEY: ${KITE_API_KEY:-}
      KITE_API_SECRET: ${KITE_API_SECRET:-}
      KITE_REDIRECT_URL: ${KITE_REDIRECT_URL:-http://localhost:5000/api/kite/callback}
      KITE_FRONTEND_URL: ${KITE_FRONTEND_URL:-http://localhost:3000}

  frontend:
    build: ./frontend
    container_name: mock-up-market-frontend
    profiles: ["full"]
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

  # Hot-reload dev mode: bind-mounts source into plain python/node images
  # instead of building a custom image, so Flask's debug reloader and
  # Vite's HMR both work exactly like native dev, just inside containers.
  # Coexists with the "full" profile (different host ports: 5001/3001 vs
  # 5000/3000) and with plain `docker compose up -d` (Mongo only).
  #   docker compose --profile dev up --build -d
  backend-dev:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    container_name: mock-up-market-backend-dev
    profiles: ["dev"]
    working_dir: /app
    volumes:
      - ./backend:/app
      - backend_venv_dev:/app/.venv
    ports:
      - "5001:5000"
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongo:27017
      DB_NAME: ${DB_NAME:-AlgoTradingSource}
      FLASK_PORT: 5000
      FLASK_DEBUG: "true"
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-change-this-in-production}
      CORS_ORIGINS: http://localhost:3001,http://localhost:5173
      KITE_ALLOW: ${KITE_ALLOW:-true}
      KITE_API_KEY: ${KITE_API_KEY:-}
      KITE_API_SECRET: ${KITE_API_SECRET:-}
      KITE_REDIRECT_URL: ${KITE_REDIRECT_URL:-http://localhost:5001/api/kite/callback}
      KITE_FRONTEND_URL: ${KITE_FRONTEND_URL:-http://localhost:3001}
    command: sh -c "uv sync && uv run python run.py"

  frontend-dev:
    image: node:20-alpine
    container_name: mock-up-market-frontend-dev
    profiles: ["dev"]
    working_dir: /app
    volumes:
      - ./frontend:/app
      # Named volume layered over node_modules so npm install writes go
      # here, not onto the host bind mount - keeps linux-built native
      # deps (e.g. anything with prebuilt binaries) from clobbering
      # whatever's already in your host frontend/node_modules, and
      # vice versa.
      - frontend_node_modules_dev:/app/node_modules
    ports:
      - "3001:5173"
    environment:
      VITE_PROXY_TARGET: http://backend-dev:5000
    depends_on:
      - backend-dev
    # npm ci, not npm install: installs strictly from the existing lockfile
    # without ever rewriting it - npm install here would silently regenerate
    # package-lock.json through the bind mount using this container's (older)
    # npm on every start, clobbering metadata the host's npm had written.
    command: sh -c "npm ci && npm run dev"

# WARNING: volumes are NOT scoped to a profile. `docker compose --profile
# dev down -v` (or --profile full, or any combination) still deletes
# mongo_data - Compose's -v flag removes every volume declared in this
# file regardless of which profile you tore down. If you want to reset
# ONLY frontend_node_modules_dev, remove it directly instead:
#   docker volume rm mock-up-market_frontend_node_modules_dev
# Only pass -v when you genuinely mean "also wipe the Mongo data."
volumes:
  mongo_data:
  frontend_node_modules_dev:
  backend_venv_dev:
