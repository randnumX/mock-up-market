services:
  mongo:
    image: mongo:latest
    container_name: mock-up-market-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # `backend` and `frontend` are opt-in via the "full" profile so the default
  # `docker compose up -d` behavior (just Mongo, for local hybrid dev with
  # `python run.py` / `npm run dev` run natively) is unchanged. Run the whole
  # app containerized with:
  #   docker compose --profile full up --build -d
  backend:
    build: ./backend
    container_name: mock-up-market-backend
    profiles: ["full"]
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "5000:5000"
    volumes:
      - ./backend/logs:/app/logs
      - kite_session:/app/.kite_session
    env_file:
      - ./backend/.env.prod

  frontend:
    build: ./frontend
    container_name: mock-up-market-frontend
    profiles: ["full"]
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    env_file:
      - ./frontend/.env.prod

  # Hot-reload dev mode: bind-mounts source into plain python/node images
  # instead of building a custom image, so Flask's debug reloader and
  # Vite's HMR both work exactly like native dev, just inside containers.
  # Coexists with the "full" profile (different host ports: 5001/3001 vs
  # 5000/3000) and with plain `docker compose up -d` (Mongo only).
  #   docker compose --profile dev up --build -d
  backend-dev:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    container_name: mock-up-market-backend-dev
    profiles: ["dev"]
    working_dir: /app
    volumes:
      - ./backend:/app
      - backend_venv_dev:/app/.venv
    ports:
      - "5001:5000"
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - ./backend/.env.dev
    environment:
      # Override MONGO_URI: .env.dev uses localhost but inside Docker the
      # Mongo container is reachable by its service name, not localhost.
      MONGO_URI: mongodb://mongo:27017
      VITE_PROXY_TARGET: http://backend-dev:5000
    command: sh -c "uv sync && uv run python run.py"

  frontend-dev:
    image: node:20-alpine
    container_name: mock-up-market-frontend-dev
    profiles: ["dev"]
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules_dev:/app/node_modules
    ports:
      - "3001:5173"
    env_file:
      - ./frontend/.env.dev
    environment:
      # Override: inside Docker the backend is reachable by service name
      VITE_PROXY_TARGET: http://backend-dev:5000
    depends_on:
      - backend-dev
    command: sh -c "npm ci && npm run dev"

# WARNING: volumes are NOT scoped to a profile. `docker compose --profile
# dev down -v` (or --profile full, or any combination) still deletes
# mongo_data - Compose's -v flag removes every volume declared in this
# file regardless of which profile you tore down. If you want to reset
# ONLY frontend_node_modules_dev, remove it directly instead:
#   docker volume rm mock-up-market_frontend_node_modules_dev
# Only pass -v when you genuinely mean "also wipe the Mongo data."
volumes:
  mongo_data:
  frontend_node_modules_dev:
  backend_venv_dev:
  kite_session:
